<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Lucifer Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-gray-100 min-h-screen font-sans">
  <div class="max-w-6xl mx-auto px-4 py-4 sm:py-6">
    <!-- Header Navigation -->
    <div class="flex justify-between items-center mb-4 sm:mb-6">
      <a href="index.html" class="text-red-500 text-xs sm:text-sm font-medium hover:underline flex items-center gap-1">&larr; Back to Catalog</a>
      <span class="text-xs sm:text-sm text-gray-400 font-semibold">Lucifer Donghua</span>
    </div>

    <!-- Title -->
    <h1 id="anime-title" class="text-base sm:text-2xl font-bold mb-3 sm:mb-4 text-gray-100 line-clamp-2">Loading Stream...</h1>

    <!-- Player Container -->
    <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-2xl mb-4 border border-gray-800" id="player-container">
      <div class="flex items-center justify-center h-full text-xs sm:text-sm text-gray-500">Select an episode to load stream</div>
    </div>

    <!-- Control Bar -->
    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 bg-[#12141c] p-3 sm:p-4 rounded-xl border border-gray-800 mb-6">
      <div class="flex flex-wrap items-center justify-between md:justify-start gap-3">
        <!-- Quality Selector -->
        <div class="flex items-center gap-2">
          <span class="text-[11px] sm:text-xs text-gray-400 font-semibold uppercase">Quality:</span>
          <select id="quality-selector" onchange="changeQuality(this.value)" class="bg-gray-800 text-white text-xs px-2.5 py-1 rounded-lg border border-gray-700 outline-none focus:border-red-600">
            <option value="1080p">1080p FHD</option>
            <option value="720p">720p HD</option>
            <option value="4k">4K Ultra</option>
            <option value="360p">360p SD</option>
          </select>
        </div>

        <!-- Server Selector Buttons -->
        <div class="flex items-center gap-1.5">
          <span class="text-[11px] sm:text-xs text-gray-400 font-semibold uppercase">Server:</span>
          <button onclick="switchServer(0)" id="btn-0" class="px-2.5 py-1 bg-red-600 text-white text-xs font-medium rounded-md">1</button>
          <button onclick="switchServer(1)" id="btn-1" class="px-2.5 py-1 bg-gray-800 text-white text-xs font-medium rounded-md hover:bg-gray-700">2</button>
          <button onclick="switchServer(2)" id="btn-2" class="px-2.5 py-1 bg-gray-800 text-white text-xs font-medium rounded-md hover:bg-gray-700">3</button>
        </div>
      </div>

      <!-- Download Button -->
      <a id="download-btn" href="#" target="_blank" class="w-full md:w-auto text-center px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5 shadow">
        <span>⬇</span> Download Episode
      </a>
    </div>

    <!-- Episode Selector Section -->
    <div class="bg-[#12141c] p-3 sm:p-4 rounded-xl border border-gray-800">
      <h2 class="text-sm sm:text-base font-semibold mb-3 text-gray-200">Episodes List:</h2>
      <div id="episodes-grid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 max-h-64 overflow-y-auto pr-1">
        <p class="col-span-full text-xs text-gray-500">Loading available episodes...</p>
      </div>
    </div>
  </div>

  <script>
    const PRIMARY_API = "https://api.consumet.org/anime/gogoanime";
    const PROXY_API = "https://corsproxy.io/?" + encodeURIComponent("https://api.consumet.org/anime/gogoanime");
    
    const params = new URLSearchParams(window.location.search);
    const animeId = params.get('animeId') || 'perfect-world';

    let currentEpisodes = [];

    // Fallback episodes generator if external API fails
    function generateFallbackEpisodes(title) {
      const eps = [];
      for (let i = 1; i <= 24; i++) {
        eps.push({
          number: i,
          id: `${animeId}-episode-${i}`,
          url: `https://vidsrc.to/embed/anime/${animeId}/${i}`
        });
      }
      return eps;
    }

    async function loadAnimeData() {
      const titleElem = document.getElementById('anime-title');
      let data = null;

      try {
        let res = await fetch(`${PRIMARY_API}/info/${animeId}`).catch(() => null);
        if (!res || !res.ok) {
          res = await fetch(`${PROXY_API}/info/${animeId}`).catch(() => null);
        }

        if (res && res.ok) {
          data = await res.json();
        }
      } catch (err) {
        console.log("API Fetch failed, switching to backup embed player.");
      }

      if (data && data.title) {
        titleElem.textContent = data.title;
        currentEpisodes = data.episodes || [];
      } else {
        // Fallback display formatting
        const formattedTitle = animeId.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        titleElem.textContent = formattedTitle;
        currentEpisodes = generateFallbackEpisodes(formattedTitle);
      }

      renderEpisodes(currentEpisodes);
      if (currentEpisodes.length > 0) {
        loadEpisodeStream(currentEpisodes[0].id, currentEpisodes[0].number);
      }
    }

    function renderEpisodes(episodes) {
      const epContainer = document.getElementById('episodes-grid');
      epContainer.innerHTML = '';
      
      episodes.forEach((ep) => {
        const btn = document.createElement('button');
        btn.className = "p-2 text-xs rounded-lg bg-gray-800 hover:bg-red-600 border border-gray-700 hover:border-red-600 text-center transition font-medium";
        btn.textContent = `Ep ${ep.number}`;
        btn.onclick = () => loadEpisodeStream(ep.id, ep.number);
        epContainer.appendChild(btn);
      });
    }

    async function loadEpisodeStream(episodeId, epNum) {
      const container = document.getElementById('player-container');
      const dlBtn = document.getElementById('download-btn');
      
      // Default direct video embed fallback
      const embedUrl = `https://vidsrc.to/embed/anime/${animeId}/${epNum}`;
      dlBtn.href = embedUrl;
      container.innerHTML = `<iframe src="${embedUrl}" class="w-full h-full border-0" allowfullscreen></iframe>`;

      try {
        let res = await fetch(`${PRIMARY_API}/watch/${episodeId}`).catch(() => null);
        if (!res || !res.ok) {
          res = await fetch(`${PROXY_API}/watch/${episodeId}`).catch(() => null);
        }

        if (res && res.ok) {
          const streamData = await res.json();
          if (streamData.sources && streamData.sources.length > 0) {
            const streamUrl = streamData.sources[0].url;
            dlBtn.href = streamUrl;
            container.innerHTML = `<iframe src="${streamUrl}" class="w-full h-full border-0" allowfullscreen></iframe>`;
          }
        }
      } catch (err) {
        console.log("Using backup stream iframe.");
      }
    }

    function switchServer(index) {
      [0, 1, 2].forEach(i => {
        const b = document.getElementById(`btn-${i}`);
        if (b) b.className = i === index ? 'px-2.5 py-1 bg-red-600 text-white text-xs font-medium rounded-md' : 'px-2.5 py-1 bg-gray-800 text-white text-xs font-medium rounded-md hover:bg-gray-700';
      });
    }

    function changeQuality(val) {
      console.log("Quality set to:", val);
    }

    loadAnimeData();
  </script>
</body>
</html>
