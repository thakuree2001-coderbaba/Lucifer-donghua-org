<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Lucifer Donghua Org</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
  <header class="bg-gray-900 p-4 border-b border-gray-800 flex items-center justify-between">
    <a href="index.html" class="text-red-500 text-sm font-bold hover:underline">← Back to Catalog</a>
    <span class="text-xs text-gray-400">Lucifer Donghua Org</span>
  </header>
  <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
    <h1 id="video-title" class="text-lg font-bold mb-4 text-white">Loading...</h1>
    <div class="relative w-full pb-[56.25%] bg-black rounded-xl overflow-hidden border border-gray-800 shadow-xl">
      <iframe id="video-player" class="absolute top-0 left-0 w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const streamUrl = params.get('url');
    const title = params.get('title');
    if (streamUrl && title) {
      document.getElementById('video-title').textContent = title;
      document.getElementById('video-player').src = streamUrl;
    } else {
      document.getElementById('video-title').textContent = "Video Stream Not Found";
    }
  </script>
</body>
</html>
