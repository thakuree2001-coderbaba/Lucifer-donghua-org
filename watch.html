<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch - Lucifer Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <a href="index.html" class="text-red-500 font-medium hover:underline">&larr; Back to Catalog</a>
      <span class="text-sm text-gray-400">Lucifer Donghua Org</span>
    </div>
    <h1 id="video-title" class="text-xl font-bold mb-4">Loading...</h1>
    <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden shadow-lg" id="player-container">
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('url');
    const title = params.get('title');

    if (title) document.getElementById('video-title').textContent = title;

    const container = document.getElementById('player-container');
    if (videoUrl) {
      if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
        container.innerHTML = `<iframe src="${videoUrl}" class="w-full h-full" allowfullscreen></iframe>`;
      } else {
        container.innerHTML = `<video src="${videoUrl}" controls autoplay class="w-full h-full"></video>`;
      }
    }
  </script>
</body>
</html>
