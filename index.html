<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucifer Donghua Org - Watch Anime & Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen flex flex-col">
  <header class="bg-gray-900 border-b border-gray-800 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center gap-4">
      <a href="index.html" class="text-xl font-bold text-red-500 tracking-wider hover:opacity-90">
        LUCIFER <span class="text-white">DONGHUA</span>
      </a>
      <div class="relative flex-1 max-w-xs">
        <input 
          type="text" 
          id="search-input"
          placeholder="Search donghua..." 
          class="w-full bg-gray-800 text-sm px-4 py-2 rounded-full border border-gray-700 focus:outline-none focus:border-red-500 text-gray-200 placeholder-gray-400"
        >
      </div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto p-4 flex-grow w-full">
    <div class="bg-gradient-to-r from-red-900 to-gray-900 rounded-xl p-6 mb-8 border border-gray-800 shadow-lg">
      <span class="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded upper">Featured</span>
      <h2 class="text-2xl font-bold mt-2 text-white">Battle Through The Heavens</h2>
      <p class="text-xs text-gray-300 mt-1 max-w-md">Season 5 - Follow Xiao Yan on his journey to master heavenly flames.</p>
    </div>
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold border-l-4 border-red-500 pl-3">Latest Releases</h3>
      <span class="text-xs text-gray-400">Updated Daily</span>
    </div>
    <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </main>
  <footer class="bg-gray-900 border-t border-gray-800 p-6 text-center text-xs text-gray-500 mt-8">
    <p>© 2026 Lucifer Donghua Org. All rights reserved.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
