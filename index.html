<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucifer Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d0d11; color: #e1e1e6; font-family: system-ui, -apple-system, sans-serif; }
    .bg-card { background-color: #15161c; }
    .badge-sub { background-color: #f59e0b; color: #000; font-weight: 700; }
    .badge-type { background-color: #0284c7; color: #fff; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <!-- Navigation Header -->
  <header class="sticky top-0 z-50 bg-[#111217]/95 border-b border-gray-800/60 px-3 py-2.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="toggleMenu()" class="text-gray-300 hover:text-white text-xl p-1 focus:outline-none">&#9776;</button>
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-red-600 font-extrabold text-base tracking-wider">LUCIFER</span>
        <span class="text-xs text-white font-bold bg-red-600/20 px-2 py-0.5 rounded border border-red-600/40">DONGHUA</span>
      </a>
    </div>
    <div class="flex items-center gap-2">
      <input type="text" id="search-input" placeholder="Search donghua..." class="bg-gray-800 text-xs px-2.5 py-1.5 rounded border border-gray-700 text-white outline-none focus:border-red-600" onkeyup="if(event.key==='Enter') searchAnime()">
      <button onclick="searchAnime()" class="bg-red-600 text-white text-xs px-3 py-1.5 rounded font-bold">Search</button>
    </div>
  </header>

  <!-- Navigation Drawer Menu -->
  <div id="nav-drawer" class="hidden bg-[#15161c] border-b border-gray-800 p-4 space-y-2">
    <a href="index.html" class="block text-sm text-gray-200 hover:text-red-500 font-semibold">🏠 Home</a>
    <a href="#popular-section" class="block text-sm text-gray-200 hover:text-red-500 font-semibold">🔥 Popular Series</a>
    <a href="#recent-section" class="block text-sm text-gray-200 hover:text-red-500 font-semibold">🆕 Latest Releases</a>
  </div>

  <main class="max-w-4xl mx-auto px-3 pt-3">
    <!-- Premium Banner -->
    <div class="relative overflow-hidden rounded-xl bg-gradient-to-r from-red-950/80 via-red-900/40 to-card p-4 border border-red-900/40 mb-5 shadow-lg">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-2xl">👑</span>
        <h2 class="text-lg font-bold text-white">Go Premium and Remove All Ads</h2>
      </div>
      <p class="text-xs text-gray-300 mb-3">No ads, faster player, full 4K access. Start from $1.19 per month.</p>
      <button class="px-4 py-2 bg-red-600 text-white text-xs font-bold rounded-lg">Get Premium &rarr;</button>
    </div>

    <!-- Catalog Section -->
    <section id="popular-section" class="mb-6">
      <div class="bg-red-700 text-white font-bold text-sm px-3 py-1.5 rounded-t-md inline-block">Popular Donghua</div>
      <div class="border-t-2 border-red-700 pt-3">
        <div id="popular-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5"></div>
      </div>
    </section>

    <section id="recent-section" class="mb-6">
      <div class="flex items-center justify-between mb-3 border-b border-gray-800 pb-1.5">
        <h2 class="text-sm font-bold text-white uppercase tracking-wide">Latest Releases</h2>
      </div>
      <div id="recent-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5"></div>
    </section>
  </main>

  <script>
    const DEFAULT_CATALOG = [
      { id: "perfect-world", title: "Perfect World [Wanmei Shijie]", ep: "Ep 284", img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&h=400&fit=crop" },
      { id: "against-the-gods", title: "Against the Gods S2", ep: "Ep 22", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300&h=400&fit=crop" },
      { id: "jade-dynasty", title: "Jade Dynasty Final S4", ep: "Ep 04", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&h=400&fit=crop" },
      { id: "renegade-immortal", title: "Renegade Immortal [Xian Ni]", ep: "Ep 52", img: "https://images.unsplash.com/photo-1563089145-599997674d42?w=300&h=400&fit=crop" },
      { id: "swallowed-star", title: "Swallowed Star S4", ep: "Ep 110", img: "https://images.unsplash.com/photo-1514539079130-25950c84af65?w=300&h=400&fit=crop" },
      { id: "soul-land-2", title: "Soul Land 2", ep: "Ep 45", img: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300&h=400&fit=crop" }
    ];

    function renderCatalog() {
      const pGrid = document.getElementById('popular-grid');
      const rGrid = document.getElementById('recent-grid');

      pGrid.innerHTML = DEFAULT_CATALOG.map(item => createCardHtml(item)).join('');
      rGrid.innerHTML = DEFAULT_CATALOG.map(item => createCardHtml(item)).join('');
    }

    function createCardHtml(item) {
      return `
        <a href="watch.html?animeId=${item.id}&title=${encodeURIComponent(item.title)}" class="group relative bg-card rounded-md overflow-hidden border border-gray-800 hover:border-red-600 transition">
          <div class="relative aspect-[3/4]">
            <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            <span class="absolute top-1 right-1 badge-type text-[9px] px-1 rounded">DONGHUA</span>
            <span class="absolute bottom-1 right-1 badge-sub text-[9px] px-1 rounded">Sub</span>
            <span class="absolute bottom-1 left-1 text-[9px] bg-black/80 text-gray-200 px-1 rounded">${item.ep}</span>
          </div>
          <div class="p-1.5">
            <h3 class="text-xs font-semibold line-clamp-2 text-gray-200 group-hover:text-red-500">${item.title}</h3>
          </div>
        </a>
      `;
    }

    function toggleMenu() {
      document.getElementById('nav-drawer').classList.toggle('hidden');
    }

    function searchAnime() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      if (!q) return renderCatalog();
      const filtered = DEFAULT_CATALOG.filter(i => i.title.toLowerCase().includes(q));
      document.getElementById('popular-grid').innerHTML = filtered.map(item => createCardHtml(item)).join('');
    }

    document.addEventListener('DOMContentLoaded', renderCatalog);
  </script>
</body>
</html>
