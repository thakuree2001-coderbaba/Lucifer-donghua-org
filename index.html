<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucifer Donghua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#0b0c10] text-gray-100 min-h-screen font-sans antialiased">

  <!-- Top Navigation Bar -->
  <header class="bg-[#12141c] border-b border-gray-800/60 sticky top-0 z-50 px-3 py-2.5 flex items-center justify-between gap-2">
    <div class="flex items-center gap-3">
      <button class="text-gray-300 hover:text-white text-xl p-1 focus:outline-none">
        &#9776;
      </button>
      <div class="flex items-center gap-2">
        <span class="text-red-600 font-extrabold text-lg tracking-wider">LUCIFER</span>
        <span class="text-white font-bold text-sm bg-red-600/20 px-2 py-0.5 rounded border border-red-600/30">DONGHUA</span>
      </div>
    </div>

    <!-- Header Right Controls -->
    <div class="flex items-center gap-2 sm:gap-3">
      <button class="hidden sm:flex text-gray-400 hover:text-white text-sm p-1.5 bg-gray-800/80 rounded">
        &#9638;
      </button>

      <div class="flex items-center bg-gray-800/80 rounded-full p-0.5 border border-gray-700">
        <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-gray-700 text-gray-200">&#9881;</span>
      </div>

      <button class="bg-amber-400 hover:bg-amber-500 text-black font-bold text-xs px-3 py-1.5 rounded transition shadow">
        &rarr; Login
      </button>

      <button class="text-gray-300 hover:text-white p-1 text-base">
        &#128269;
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 space-y-6">

    <!-- Continue Watching / History Section -->
    <div id="history-section"></div>

    <!-- Popular Today Section -->
    <section>
      <div class="bg-gradient-to-r from-red-700 to-red-900 text-white px-4 py-2 rounded-t-lg font-bold text-sm sm:text-base tracking-wide flex items-center justify-between">
        <span>Popular Today</span>
      </div>

      <div id="popular-container" class="bg-[#12141c] p-3 rounded-b-lg border-x border-b border-gray-800/80 flex gap-3 overflow-x-auto no-scrollbar py-4">
      </div>
    </section>

    <!-- Latest Release Section -->
    <section>
      <div class="flex items-center justify-between bg-[#12141c] px-4 py-3 rounded-t-lg border-t border-x border-gray-800/80">
        <h2 class="text-base sm:text-lg font-bold text-white tracking-wide">Latest Release</h2>
        <button class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-[11px] font-bold px-2.5 py-1 rounded uppercase tracking-wider transition">
          VIEW ALL
        </button>
      </div>

      <div id="catalog-grid" class="bg-[#12141c] p-3 sm:p-4 rounded-b-lg border border-gray-800/80 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 sm:gap-4">
        <p class="col-span-full text-center text-gray-400 py-10">Loading releases...</p>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
